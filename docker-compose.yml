version: '3.8'

services:
  v86-engine:
    build: .
    container_name: v86-engine
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./iso:/app/iso
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
