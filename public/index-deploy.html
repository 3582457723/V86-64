<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V86 マルチアーキテクチャOS仮想環境</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>🖥️ V86 OS仮想環境エンジン</h1>
      <p>ブラウザ上でLinuxやOSを実行 - x86/x86-64/ARM64対応</p>
    </header>

    <section class="panel">
      <h2>⚙️ 仮想環境の起動</h2>
      <div class="control-row">
        <label for="os-select">起動するOS</label>
        <select id="os-select">
          <option>読み込み中...</option>
        </select>
      </div>
      <div class="control-row">
        <label for="architecture-select">アーキテクチャ</label>
        <select id="architecture-select">
          <option value="auto">自動検出</option>
          <option value="x86">x86 (32-bit)</option>
          <option value="x86-64">x86-64 (64-bit)</option>
          <option value="x32">x32</option>
          <option value="arm64">ARM64</option>
        </select>
      </div>
      <div class="control-row">
        <label for="memory-size">メモリサイズ</label>
        <select id="memory-size">
          <option value="128">128 MB</option>
          <option value="256">256 MB</option>
          <option value="512" selected>512 MB</option>
          <option value="1024">1024 MB</option>
          <option value="2048">2048 MB</option>
          <option value="4096">4096 MB</option>
          <option value="8192">8192 MB</option>
        </select>
      </div>
      <div class="control-row">
        <label for="cpu-count">CPU コア数</label>
        <select id="cpu-count">
          <option value="1" selected>1 コア</option>
          <option value="2">2 コア</option>
          <option value="3">3 コア</option>
          <option value="4">4 コア</option>
          <option value="5">5 コア</option>
          <option value="8">8 コア</option>
        </select>
      </div>
      <div class="control-row buttons">
        <button id="start">▶ 起動</button>
        <button id="reset" disabled>🔄 リセット</button>
        <button id="stop" disabled>⏹ 停止</button>
      </div>
      <div class="status" id="status">準備完了</div>
    </section>

    <section class="emulator-panel">
      <div id="screen" class="screen"></div>
      <div class="log-panel">
        <h2>📋 ログ</h2>
        <pre id="log-output"></pre>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/v86@latest/dist/v86.js"></script>
  <script defer src="app-deploy.js"></script>
</body>
</html>
